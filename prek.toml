minimum_prek_version = "0.3.0"

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-yaml"
args = ["-m"]

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos]]
repo = "https://github.com/Agilicus/pre-commit-hook-k8svalidate.git"
rev = "v0.2.0"

[[repos.hooks]]
id = "k8svalidate"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-sops-encrypted"
name = "Verify *.enc.yaml files are SOPS-encrypted"
language = "system"
entry = "bash -c 'for f in \"$@\"; do grep -q \"^sops:\" \"$f\" || { echo \"Unencrypted: $f\" >&2; exit 1; }; done' --"
files = '\.enc\.yaml$'
