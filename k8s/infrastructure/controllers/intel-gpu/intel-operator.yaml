---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: nfd
  interval: 24h
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: "0.36.x"
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  targetNamespace: kube-system
  install:
    createNamespace: false
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
