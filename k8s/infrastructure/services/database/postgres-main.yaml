apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-main
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: longhorn-fast-single
  affinity:
    nodeSelector:
      hardware.home/storage: nvme
  # todo: consider migrating backups to cnpg in the future
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: "enabled"
      recurring-job-group.longhorn.io/default: "enabled"
      recurring-job.longhorn.io/daily-snapshot: "enabled"
  superuserSecret:
    name: postgres-main-superuser
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  managed:
    roles:
      - name: authentik
        login: true
        passwordSecret:
          name: authentik-db-secret
      - name: n8n
        login: true
        passwordSecret:
          name: n8n-db-secret
      - name: netweave
        login: true
        passwordSecret:
          name: netweave-db-secret
