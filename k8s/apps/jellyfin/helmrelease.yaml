---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 72h
  chart:
    spec:
      chart: jellyfin
      version: "3.x.x"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  targetNamespace: jellyfin
  install:
    createNamespace: true
  values:
    image:
      tag: "12"
      pullPolicy: Always
    replicaCount: 1
    deploymentStrategy:
      type: Recreate
    nodeSelector:
      hardware.home/gpu: "true"

    persistence:
      media:
        enabled: true
        existingClaim: jellyfin-media-pvc
        mountPath: /media
        readOnly: true
      config:
        enabled: true
        existingClaim: jellyfin-config
        mountPath: /config

    volumes:
      - name: jellyfin-web
        emptyDir: {}

    volumeMounts:
      - name: jellyfin-web
        mountPath: /jellyfin/jellyfin-web

    extraInitContainers:
      - name: abyss-spotlight
        image: docker.io/jellyfin/jellyfin:12
        command:
          - sh
          - -c
          - |
            cp -a /jellyfin/jellyfin-web/. /mnt/web/
            base=https://cdn.jsdelivr.net/gh/AumGupta/abyss-jellyfin@v1.2.3/scripts/spotlight
            mkdir -p /mnt/web/ui
            if curl -fsSL "$base/spotlight.html" -o /mnt/web/ui/spotlight.html \
              && curl -fsSL "$base/spotlight.css" -o /mnt/web/ui/spotlight.css \
              && curl -fsSL "$base/spotlight-loader.js" -o /mnt/web/ui/spotlight-loader.js; then
              grep -q 'spotlight-loader.js' /mnt/web/index.html || \
                sed -i 's|</body>|<script src="ui/spotlight-loader.js" data-abyss-spotlight></script></body>|' /mnt/web/index.html
            else
              echo "WARN: Abyss Spotlight download failed; booting vanilla jellyfin-web" >&2
            fi
        volumeMounts:
          - name: jellyfin-web
            mountPath: /mnt/web

    securityContext:
      privileged: false
      capabilities:
        drop:
          - "ALL"

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: jellyfin.${SECRET_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
    jellyfin:
      env:
        - name: DOTNET_USE_POLLING_FILE_WATCHER
          value: "true"
        - name: LIBVA_DRIVER_NAME
          value: "iHD"
        - name: JELLYFIN_PublishedServerUrl
          value: "https://jellyfin.${SECRET_DOMAIN}"
      probes:
        liveness:
          enabled: true
          custom: true
          spec:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 20
        readiness:
          enabled: true
          custom: true
          spec:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 20

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
        gpu.intel.com/i915: 1
        ephemeral-storage: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
        gpu.intel.com/i915: 1
        ephemeral-storage: 12Gi
