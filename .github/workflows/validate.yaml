name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run prek hooks
        uses: j178/prek-action@v3
        with:
          extra-args: --all-files

      - name: Validate renovate.json
        run: jq empty renovate.json

      - name: Validate Flux kustomizations
        run: |
          set -euo pipefail
          for dir in \
            k8s/flux-system \
            k8s/infrastructure/controllers \
            k8s/infrastructure/services \
            k8s/infrastructure/configs \
            k8s/apps
          do
            echo "Building $dir..."
            kubectl kustomize "$dir" > /dev/null
          done
